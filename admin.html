<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin orders | MrLogicwise</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="portal.css"></head><body><header class="nav"><a class="brand" href="index.html"><img src="assets/logo.jpg" alt=""><span>MrLogicwise</span></a><nav><a href="account.html">Customer portal</a><a href="index.html">Home</a></nav></header><main class="portal-wrap"><span class="portal-chip">Private admin area</span><h1>Order dashboard</h1><p class="portal-muted">Enter the admin API token configured as the Cloudflare Worker secret <code>ADMIN_TOKEN</code>. This token is never stored in the page.</p><section class="portal-card" style="margin-top:24px"><div class="portal-field"><label for="admin-token">Admin API token</label><input id="admin-token" type="password" autocomplete="off"></div><div class="portal-actions"><button class="portal-btn" id="load-admin">Load orders</button></div><p id="admin-status" class="portal-status" hidden></p><div id="admin-orders"></div></section></main><script>
const API="https://vite-react-template.ck-brandivity.workers.dev";const $=id=>document.getElementById(id);const money=n=>"₹"+(Number(n||0)/100).toLocaleString("en-IN");$("load-admin").onclick=async()=>{const token=$("admin-token").value.trim();if(!token){$("admin-status").hidden=false;$("admin-status").textContent="Enter the admin token.";return}try{const r=await fetch(API+"/api/admin/orders",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to load orders");$("admin-orders").replaceChildren();d.orders.forEach(o=>{const row=document.createElement("div");row.className="portal-row";const a=document.createElement("div"),b=document.createElement("b"),s=document.createElement("small");b.textContent=o.customer_email+" · "+o.plan;s.textContent=o.id+" · "+new Date(o.created_at).toLocaleString("en-IN");a.append(b,s);const c=document.createElement("div"),v=document.createElement("b"),st=document.createElement("small");v.textContent=money(o.amount_paise);st.textContent=o.status.toUpperCase();c.append(v,st);row.append(a,c);$("admin-orders").append(row)});$("admin-status").hidden=false;$("admin-status").textContent=d.orders.length+" orders loaded."}catch(e){$("admin-status").hidden=false;$("admin-status").textContent=e.message}};
</script></body></html>
